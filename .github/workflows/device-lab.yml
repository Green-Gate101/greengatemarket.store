# Device lab — every push builds the store, seeds a THROWAWAY database and
# drives it with OLD Chromium engines (the browsers inside older Samsung
# Internet, Android WebView, Hisense / Samsung smart-TV browsers) using
# Samsung and Hisense phone + TV profiles: the app must start, look right,
# show product photos, sign a buyer in and reach the seller's PayFast payment.
# Nothing here touches production data or secrets.
name: Device lab (old phone & TV browsers)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: device-lab-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  old-browsers:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: file:/tmp/greengate-device-lab.db
      NEXTAUTH_SECRET: device-lab-only-not-a-real-secret-0123456789
      NEXTAUTH_URL: http://localhost:3301
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Database (SQLite, throwaway)
        run: |
          bunx prisma generate
          bunx prisma db push --skip-generate

      - name: Build
        run: bun run build

      - name: Start the store
        run: |
          cd .next/standalone
          PORT=3301 HOSTNAME=0.0.0.0 nohup node server.js > ../../server.log 2>&1 &
          cd ../..
          for i in $(seq 1 60); do curl -sf http://localhost:3301/api/categories > /dev/null && break; sleep 2; done
          curl -sf http://localhost:3301/api/categories > /dev/null

      - name: Seed a test shop
        run: |
          node qa-lab/seed.mjs "$PWD"
          for p in / /product/qa-steel-kettle-1a2b3c4d /store/qa-kitchen-store-a1b2c3; do curl -s -o /dev/null "http://localhost:3301$p"; done

      - name: Old browser engines
        run: |
          status=0
          for v in 1.5.2 1.10.0 1.14.1 1.20.0 1.30.0; do
            echo "::group::Playwright $v"
            docker run --rm --network host --ipc=host -v "$PWD/qa-lab:/lab" -w /lab "mcr.microsoft.com/playwright:v$v-focal" \
              bash -lc "npm init -y > /dev/null && npm i --no-audit --no-fund --no-save playwright-core@$v > /dev/null && node old-device-check.js http://localhost:3301 chromium-pw$v" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Server log
        if: always()
        run: tail -n 200 server.log || true

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-lab-screenshots
          path: qa-lab/shots
          if-no-files-found: ignore
